<!DOCTYPE html>
<html lang="id" data-theme="ungu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perpustakaan Sekolah Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="top">
    <!-- HP: tombol hamburger di kiri logo membuka menu slide -->
    <button id="hamb" class="icon-btn hamb" data-menu="open" aria-label="Buka menu" aria-controls="drawer"
      aria-expanded="false">
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
      <i id="hamb-nb" class="nb" hidden></i>
    </button>
    <h1>
      <button type="button" class="brand" data-v="katalog" title="Ke Katalog">Pustaka<span>Kita</span></button>
      <button id="ver" class="ver" data-info="more" title="Lihat versi lengkap">v6.769</button>
    </h1>
    <!-- layar lebar: isinya tampil biasa di header. HP: menjadi panel slide dari kiri -->
    <div id="drawer" class="drawer">
      <div class="drawer-head">
        <b>Pustaka<span>Kita</span></b>
        <button class="drawer-x" data-menu="close" aria-label="Tutup menu">✕</button>
      </div>
      <nav id="nav"></nav>
      <div id="dfoot" class="dfoot"></div>
    </div>
    <div id="scrim" class="scrim" data-menu="close"></div>
    <button id="infobtn" class="icon-btn info-btn" data-info="about" aria-label="Informasi" title="Informasi">!</button>
    <button id="setbtn" class="icon-btn" data-v="setelan" aria-label="Setelan" title="Setelan"><svg class="ic"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path d="M4 7h9M17 7h3M4 17h3M11 17h9" />
        <circle cx="15" cy="7" r="2" />
        <circle cx="9" cy="17" r="2" />
      </svg></button>
    <button id="theme" class="icon-btn" data-themebtn aria-label="Ganti tema"></button>
    <div id="auth"></div>
  </header>

  <!-- peringatan tetap: buku terlambat dikembalikan -->
  <div id="alerts" hidden></div>

  <main id="main" class="view">
    <div class="loadwrap">
      <div class="spinner"></div>
    </div>
  </main>
  <div id="modal"></div>
  <!-- dialog konfirmasi kustom (diisi oleh ask() di app.js) -->
  <div id="confirm"></div>
  <!-- pembaca e-book layar penuh (diisi oleh openReader() di app.js) -->
  <div id="reader" class="reader" hidden role="dialog" aria-modal="true" aria-label="Pembaca e-book"></div>
  <div id="toasts"></div>
  <div id="busy" class="busy" hidden>
    <div class="spinner"></div>
  </div>
  <div id="offline" class="offline" role="alert">
    <div class="spinner"></div>
    <h2>Anda sedang offline</h2>
    <p>Periksa koneksi internetmu. Halaman akan kembali otomatis saat online.</p>
  </div>

  <!-- Chat Customer Service: gelembung + jendela kecil -->
  <button id="bubble" class="bubble" data-chat aria-label="Buka chat Customer Service" title="Chat Customer Service"
    hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round" aria-hidden="true">
      <path d="M4 5h16v11H9l-5 4z" />
    </svg><i id="bubble-nb" class="nb" hidden></i></button>
  <section id="chatw" class="chatw" aria-label="Chat Customer Service">
    <div class="chat-head">
      <b id="ctitle">Chat Customer Service</b>
      <button id="cend" class="endchat" data-endchat hidden>Akhiri</button>
      <button data-chat aria-label="Tutup chat">✕</button>
    </div>
    <select id="threadsel" aria-label="Pilih percakapan" hidden></select>
    <div id="cinfo" class="cinfo" hidden></div>
    <div id="msgs"></div>
    <div id="cnew" class="cnew" hidden>
      <span class="hint">Percakapan telah diakhiri.</span>
      <button class="btn sm" data-newchat>Mulai percakapan baru</button>
    </div>
    <form id="cf">
      <label class="attach" title="Kirim gambar"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path
            d="M20 11.5l-8.2 8.2a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8" />
        </svg>
        <input type="file" id="cfile" accept="image/*" hidden>
      </label>
      <input name="body" placeholder="Tulis pesan" maxlength="1000" autocomplete="off">
      <button class="btn" id="send">Kirim</button>
    </form>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="app.js"></script>
</body>

</html>
